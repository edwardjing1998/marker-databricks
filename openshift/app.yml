apiVersion: v1
kind: ServiceAccount
metadata:
  name: marker-databricks
imagePullSecrets:
  - name: marker-databricks-ghcr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marker-databricks
  labels:
    app: marker-databricks
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: marker-databricks
  template:
    metadata:
      labels:
        app: marker-databricks
      annotations:
        marker-databricks/deploy-id: REPLACE_DEPLOY_ID
    spec:
      serviceAccountName: marker-databricks
      automountServiceAccountToken: false
      containers:
        - name: api
          image: REPLACE_IMAGE
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: marker-databricks-config
          env:
            - name: DATABRICKS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: marker-databricks-secret
                  key: DATABRICKS_CLIENT_ID
            - name: DATABRICKS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: marker-databricks-secret
                  key: DATABRICKS_CLIENT_SECRET
            - name: DATABRICKS_AUTH_TYPE
              value: oauth-m2m
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: marker-databricks
spec:
  type: ClusterIP
  externalIPs: []
  selector:
    app: marker-databricks
  ports:
    - name: http
      port: 8080
      targetPort: http
